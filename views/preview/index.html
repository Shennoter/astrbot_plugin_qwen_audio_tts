<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音色试听 · Qwen Audio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>音色试听</h1>
    <p>使用插件已保存的模型、音色、音频参数和替换词典。每次生成会调用语音服务并产生相应费用。</p>
    <section aria-label="当前配置">
      <div class="section-heading"><h2>当前配置</h2><button type="button" id="refresh">刷新配置</button></div>
      <p id="settings">正在加载…</p>
      <p class="hint">修改 API Key、音色或语速等参数后，请先在插件配置表单保存，再点“刷新配置”。</p>
    </section>
    <form id="preview-form">
      <label for="text">试听文字 <span id="count"></span></label>
      <textarea id="text" rows="5" required></textarea>
      <label for="language">朗读语言</label>
      <select id="language">
        <option value="auto">跟随默认语言</option>
        <option value="zh">汉语</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
      </select>
      <p class="hint">按所选语言朗读原文，不自动翻译；这里修改文字和语言只用于本次试听。</p>
      <button id="generate" type="submit" disabled>生成试听音频</button>
    </form>
    <p id="status" role="status" aria-live="polite">正在连接 AstrBot…</p>
    <section id="result" hidden aria-label="试听结果">
      <h2>试听结果</h2>
      <audio id="audio" controls preload="metadata"></audio>
      <p><a id="download" download="qwen-preview.wav">下载音频</a></p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
